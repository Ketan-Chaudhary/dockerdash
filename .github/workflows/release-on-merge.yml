name: Automated SemVer & Release on PR Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  # Only run if the PR was actually merged into main
  release-on-merge:
    name: Determine Version & Create Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Determine SemVer bump type from PR labels
      - name: Determine SemVer Bump Type
        id: bump_type
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
          echo "PR Labels: $LABELS"

          if [[ "$LABELS" =~ "major" ]]; then
            BUMP="major"
          elif [[ "$LABELS" =~ "minor" ]]; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          echo "BUMP_TYPE=$BUMP" >> $GITHUB_ENV
          echo "Selected Bump Type: $BUMP"

      # Calculate Next SemVer Tag
      - name: Calculate Next Version Tag
        id: semver
        run: |
          # Fetch latest tag or fallback to v0.1.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "Latest tag: $LATEST_TAG"

          # Strip leading 'v'
          VERSION=${LATEST_TAG#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-0}

          if [ "$BUMP_TYPE" = "major" ]; then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
            NEW_PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
            NEW_PATCH=0
          else
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$MINOR
            NEW_PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Calculated New Tag: $NEW_TAG"

      # Update pyproject.toml & CHANGELOG.md
      - name: Update pyproject.toml and CHANGELOG.md
        run: |
          # Update version in pyproject.toml
          sed -i 's/version = "[^"]*"/version = "'"$NEW_VERSION"'"/' pyproject.toml
          sed -i 's/__version__ = "[^"]*"/__version__ = "'"$NEW_VERSION"'"/' dockdash/__init__.py

          # Update CHANGELOG.md
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          DATE=$(date +'%Y-%m-%d')

          ENTRY="## [$NEW_TAG] - $DATE\n\n### Merged Pull Request\n- $PR_TITLE (#$PR_NUM by @$PR_AUTHOR)\n"

          # Insert release entry into CHANGELOG.md
          sed -i "/## \[Unreleased\]/a \\\\\\n$ENTRY" CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml dockdash/__init__.py CHANGELOG.md
          git commit -m "chore(release): bump version to $NEW_TAG [skip ci]" || echo "No changes to commit"
          git push origin main

          # Create and push git tag
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG - PR #$PR_NUM"
          git push origin "$NEW_TAG"

      # Build Release Artifacts & Publish GitHub Release
      - name: Install Build Tools & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . build PyInstaller

      - name: Build Executables & Packages
        run: |
          pyinstaller --onefile --name dockdash --collect-all textual --collect-all tree_sitter_languages --add-data "dockdash/styles.tcss:dockdash" dockdash/app.py
          python -m build

          tar -czvf "dist/dockdash-linux-x86_64-${NEW_TAG}.tar.gz" -C dist dockdash
          tar -czvf "dist/dockdash-${NEW_TAG}-source.tar.gz" --exclude='.venv' --exclude='build' --exclude='dist' --exclude='.git' .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: "DockDash ${{ env.NEW_TAG }}"
          body: |
            ## Release ${{ env.NEW_TAG }}

            ### Merged Pull Request
            - ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }}) by @${{ github.event.pull_request.user.login }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes.
          files: |
            dist/*.whl
            dist/dockdash-linux-x86_64-${{ env.NEW_TAG }}.tar.gz
            dist/dockdash-${{ env.NEW_TAG }}-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
