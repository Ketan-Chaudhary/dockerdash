name: Publish Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish GitHub Release
    # Run only if the merged PR is an automated Release PR
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'chore(release)')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Extract Tag from Release PR Title
      - name: Extract Tag Name
        id: tag_info
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          TAG=$(echo "$TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          fi

          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Target Release Tag: $TAG"

      # Tag the merged commit on main
      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      # Build Platform Binaries & Packages
      - name: Install Build Tools & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . build PyInstaller

      - name: Build Executables & Packages
        run: |
          pyinstaller --onefile --name dockdash --collect-all textual --collect-all tree_sitter_languages --add-data "dockdash/styles.tcss:dockdash" dockdash/app.py
          python -m build

          tar -czvf "dist/dockdash-linux-x86_64-${RELEASE_TAG}.tar.gz" -C dist dockdash
          tar -czvf "dist/dockdash-${RELEASE_TAG}-source.tar.gz" --exclude='.venv' --exclude='build' --exclude='dist' --exclude='.git' .

      # Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "DockDash ${{ env.RELEASE_TAG }}"
          body: |
            ## DockDash Release ${{ env.RELEASE_TAG }}

            Official release of DockDash ${{ env.RELEASE_TAG }}.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release details.
          files: |
            dist/*.whl
            dist/dockdash-linux-x86_64-${{ env.RELEASE_TAG }}.tar.gz
            dist/dockdash-${{ env.RELEASE_TAG }}-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
