name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build Platform Executables ───────────────────────────────────
  build-executables:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: dockdash-linux-x86_64
            asset_extension: tar.gz
          - os: windows-latest
            artifact_name: dockdash-windows-x86_64
            asset_extension: zip
          - os: macos-latest
            artifact_name: dockdash-macos-x86_64
            asset_extension: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . PyInstaller

      # Linux & macOS Build
      - name: Build Executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name dockdash --collect-data textual --collect-data tree_sitter_languages dockdash/app.py
          tar -czvf "dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.${{ matrix.asset_extension }}" -C dist dockdash

      # Windows Build
      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          pyinstaller --onefile --name dockdash --collect-data textual --collect-data tree_sitter_languages dockdash/app.py
          Compress-Archive -Path dist/dockdash.exe -DestinationPath "dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.${{ matrix.asset_extension }}"

      # Upload Platform Release Asset to GitHub Release
      - name: Upload Platform Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.${{ matrix.asset_extension }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build Universal Python Wheel & Source Tarball ────────────────
  build-python-packages:
    name: Build Universal Python Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Wheel & Source Tarball
        run: |
          python -m build
          tar -czvf "dist/dockdash-${{ github.ref_name }}-source.tar.gz" --exclude='.venv' --exclude='build' --exclude='dist' --exclude='.git' .

      - name: Upload Python Packages to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/dockdash-${{ github.ref_name }}-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
